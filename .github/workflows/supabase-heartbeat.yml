name: Supabase database heartbeat

on:
  schedule:
    # UTC: 02:23, 08:23, 14:23, 20:23 (WIB: 09:23, 15:23, 21:23, 03:23).
    # Avoid the busy start of the hour. GitHub schedules can still be delayed.
    - cron: '23 2,8,14,20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify heartbeat checks
        run: node --test scripts/supabase-heartbeat.test.mjs
      - name: Query the database health-check row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/supabase-heartbeat.mjs
